[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fog-kgqa"
version = "1.0.0"
description = "Official implementation of Foresight-on-Graph"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "graphviz>=0.20",
  "networkx>=3.1",
  "numpy>=1.24",
  "openai>=1.0",
  "pillow>=10.0",
  "requests>=2.31",
  "sentence-transformers>=2.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["FoG*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
